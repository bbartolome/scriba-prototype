schemaVersion: 1
name: undeclared_input
description: Draft a short passage from the core idea.
inputs:
  type: object
  properties:
    coreIdea:
      type: string
      title: Core idea
      x-scriba-type: text
      x-scriba-port: true
      x-scriba-control: textarea
  required: [coreIdea]
output: draft
enabled: true
prompt: |
  Write a short passage.

  Core idea: {{coreIdea}}
  Extra material: {{missing}}
