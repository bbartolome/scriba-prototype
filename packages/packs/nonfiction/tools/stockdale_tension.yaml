schemaVersion: 1
name: stockdale_tension
description: Face the hardest fact while holding on to the hope beside it.
inputs:
  type: object
  properties:
    coreIdea:
      type: string
      title: Core idea
      x-scriba-type: text
      x-scriba-port: true
      x-scriba-control: textarea
    entityIds:
      type: array
      title: Entities
      items:
        type: string
      x-scriba-type: entity
      x-scriba-port: true
    styleProfile:
      type: string
      title: Style
      x-scriba-type: style
      x-scriba-port: true
    length:
      type: integer
      title: Length
      default: 800
      minimum: 200
      maximum: 2000
    tone:
      type: string
      title: Tone
    hardFact:
      type: string
      title: Hard fact
      x-scriba-type: text
      x-scriba-port: true
    hope:
      type: string
      title: Hope
      x-scriba-type: text
      x-scriba-port: true
  required: [coreIdea, hardFact, hope]
output: draft
enabled: false
prompt: |
  You write a nonfiction passage that faces the hardest fact while holding on to the hope beside it.

  Core idea: {{coreIdea}}
  Length: {{length}} words.
  {{#if tone}}Tone: {{tone}}.
  {{/if}}Hard fact: {{hardFact}}
  Hope: {{hope}}
  Material:
  {{#each entityIds}}
  {{entity this}}
  {{/each}}
  {{#if styleProfile}}
  {{entity styleProfile}}
  {{/if}}

  Steps:
  1. State the hardest fact plainly, without softening it, using the material.
  2. State the hope beside it, and the ground the material gives for it.
  3. Hold both in the same passage: the hope must not hide the fact, and the fact must not cancel the hope.
  4. End on the core idea, in plain words.

  Constraints:
  - Use only the material above.
  - Cite each factual sentence with its entity or source ID in the form [@id].
  - Where a needed fact is missing, write TK with a short note in brackets, for example TK (year of the study). Do not invent it.
  - Follow the tone of the style profile, avoid its banned phrases, and keep to the length above.
