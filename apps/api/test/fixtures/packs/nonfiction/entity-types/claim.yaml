schemaVersion: 1
kind: claim
title: Claim
description: A statement that a chapter makes, with the sources for it.
folder: entities
fields:
  type: object
  properties:
    statement:
      type: string
      title: Statement
    status:
      type: string
      title: Status
      enum: [supported, disputed, unsupported]
    evidence:
      type: array
      title: Evidence
      items:
        type: object
        properties:
          source:
            type: string
          pages:
            type: integer
        required: [source]
        additionalProperties: false
  required: [statement]
